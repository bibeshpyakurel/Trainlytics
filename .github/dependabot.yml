# Dependabot keeps dependencies and pinned actions current.
# Updates arrive as pull requests and must pass CI like any other change.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 5
    # Version-locked peers must move together or the pull request cannot even
    # install. Dependabot proposed react-dom 19.3.0 on its own in #32, which
    # fails `npm ci` with ERESOLVE because react-dom 19.3.0 requires exactly
    # react 19.3.0. Grouping them means one installable pull request instead of
    # one broken one, and the same applies to next and its eslint config.
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
