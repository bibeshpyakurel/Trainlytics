name: CodeQL

# Static analysis on every change to main, on pull requests, and weekly so a
# newly published rule finds old code without waiting for the next commit.
on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. Work is merged into
  # `development` first and reaches main in batches, so analysing main-targeted
  # pull requests alone means a finding arrives after the code is already
  # reviewed and merged once. CI already runs on "**"; this now matches.
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "27 4 * * 1"

# Least privilege: the analysis reads the tree and writes findings, nothing else.
permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # No build step: javascript-typescript is analysed from source, so
      # Autobuild has nothing to compile and only costs minutes.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          category: "/language:${{ matrix.language }}"
